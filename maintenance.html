<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>les immonaissances — Bientôt disponible</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: #06080f;
    background-image: radial-gradient(circle at 50% 20%, rgba(99,102,241,0.25), transparent 60%);
    color:#f5f5f7;
    font-family:'Hanken Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .wrap { max-width:560px; }
  h1 {
    font-family:'Bricolage Grotesque', sans-serif;
    font-size:clamp(2rem, 6vw, 3rem);
    font-weight:800;
    line-height:1.15;
    margin-bottom:18px;
    background: linear-gradient(90deg, #818cf8, #a78bfa, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    font-size:1.05rem;
    color:#b9bcc9;
    line-height:1.6;
    margin-bottom:8px;
  }
  .badge {
    display:inline-block;
    margin-top:24px;
    padding:8px 18px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);
    font-size:0.85rem;
    letter-spacing:0.02em;
    color:#a78bfa;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>les immonaissances</h1>
    <p>Le site est en cours de finalisation.</p>
    <p>Merci de votre patience, nous revenons très vite !</p>
    <span class="badge">De retour prochainement</span>
  </div>
</body>
</html>
